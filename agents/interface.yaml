interface:
  display_name: "去 AI 味视觉审查"
  short_description: "审查并修复 AI 生成页面或代码动画的模板感，直接改代码并在目标视口验证。"
  default_prompt: "Use $de-ai-visual-review to audit this page or code animation, remove template-like visual choices, apply minimal code fixes, and verify at the target viewport."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
